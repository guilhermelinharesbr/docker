services:
  mongo:
    build:
      context: .
      dockerfile: mongo.dockerfile
    container_name: mongo
    ports:
      - 27017:27017
    networks:
      - rede-aplicacao
    volumes:
      - mongo-volume:/data/db  

  mongo-express:
    build:
      context: .
      dockerfile: mongo-express.dockerfile
    container_name: mongo-express
    ports:
      - 8081:8081
    networks:
      - rede-aplicacao

  node1:
    build:
      context: .contextPath
      dockerfile: app.dockerfile
    container_name: node1
    ports:
      - 3001:3000
    networks:
      - rede-aplicacao

  node2:
    build:
      context: .contextPath
      dockerfile: app.dockerfile
    container_name: node2
    ports:
      - 3002:3000
    networks:
      - rede-aplicacao

  node3:
    build:
      context: .contextPath
      dockerfile: app.dockerfile
    container_name: node3
    ports:
      - 3003:3000
    networks:
      - rede-aplicacao
        
  nginx:
    image: nginx:stable-alpine
    container_name: nginx
    ports:
      - 80:80
    networks:
      - rede-aplicacao
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf

networks:
  rede-aplicacao:
    name: rede-aplicacao
    driver: bridge

volumes:
  mongo-volume:
    name: mongo-volume
