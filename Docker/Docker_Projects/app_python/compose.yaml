services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: minha-api-python:1.0.0
    container_name: api-python-segura
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
    # Força o container a rodar com o usuário não-root (caso o Dockerfile não o fixe por padrão)
    user: "1001:1001"
    # Políticas de reinicialização inteligentes
    restart: unless-stopped
    # Limites rigorosos de recursos (Evita que um bug consuma toda a CPU/Memória do host)
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    # Reduz a superfície de ataque limitando capacidades de kernel desnecessárias
    cap_drop:
      - ALL
    # Healthcheck integrado para o Docker saber se a API está realmente saudável
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
